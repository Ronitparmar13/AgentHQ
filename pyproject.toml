[project]
name = "agenthq"
version = "0.1.0"
description = "AgentHQ - an autonomous AI software company"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "flask>=3.1,<4",
    "python-dotenv>=1.2,<2",
    "pydantic>=2.13,<3",
    "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]