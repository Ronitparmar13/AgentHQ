{% extends "base.html" %}

{% block title %}New Project - AgentHQ{% endblock %}

{% block content %}
    <div class="form-container">
        <h1>New Project</h1>
        <form id="project-form" class="project-form">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required maxlength="200" autofocus>
                <span class="field-error" id="title-error"></span>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="6" required maxlength="5000"></textarea>
                <span class="field-error" id="description-error"></span>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="submit-btn">Create Project</button>
                <a href="/" class="btn btn-secondary">Cancel</a>
            </div>
            <div class="form-alert" id="form-alert" role="alert" aria-live="polite"></div>
        </form>
    </div>
{% endblock %}
